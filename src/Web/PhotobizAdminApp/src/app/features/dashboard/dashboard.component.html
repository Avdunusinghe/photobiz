<div class="dashboard">
  <header class="dashboard__topbar">
    <app-logo [size]="32" [iconOnly]="true" />
    <button class="dashboard__sign-out" type="button" (click)="signOut()">Sign out</button>
  </header>

  <main class="dashboard__content">
    <h1 class="dashboard__title">Welcome back</h1>
    <p class="dashboard__subtitle">Here's what's happening with your business.</p>

    <div class="dashboard__stats">
      @for (stat of stats; track stat.label) {
        <div class="stat-card">
          <p class="stat-card__value">{{ stat.value }}</p>
          <p class="stat-card__label">{{ stat.label }}</p>
        </div>
      }
    </div>
  </main>
</div>
