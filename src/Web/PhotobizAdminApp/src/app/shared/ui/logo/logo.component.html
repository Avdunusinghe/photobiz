<span class="logo" [class.logo--icon-only]="iconOnly()">
  <svg
    class="logo__mark"
    [attr.width]="size()"
    [attr.height]="size()"
    viewBox="0 0 40 40"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <rect width="40" height="40" rx="10" class="logo__badge" />
    <rect x="15" y="9" width="10" height="4" rx="1.5" class="logo__glyph" />
    <rect x="6" y="13" width="28" height="20" rx="5" class="logo__glyph" />
    <circle cx="20" cy="23" r="7" class="logo__lens-ring" />
    <circle cx="20" cy="23" r="2.75" class="logo__lens-dot" />
  </svg>

  @if (!iconOnly()) {
    <span class="logo__wordmark">
      <span class="logo__name">Photobiz</span>
      <span class="logo__tagline">Admin</span>
    </span>
  }
</span>
